# Docker Compose per llm-gateway-demo (porta 8090)
services:
  llm-gateway-demo:
    build: .
    image: llm-gateway-demo:${VERSION:-latest}
    container_name: llm-gateway-demo
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # Cartella di configurazione con config.yaml montata in sola lettura
      - ./config_ner_demo:/app/config_ner_demo:ro
      # Cartella per chiavi EC ES256 (client-private.pem e client-public.pem)
      - ./keys:/app/keys
    extra_hosts:
      # Consente al container di contattare i servizi in ascolto sull'host Docker (es. 127.0.0.1:8096)
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - dentalcare

networks:
  # Rete condivisa del compose di DentalCare (accanto a llm-ner-gateway)
  dentalcare:
    external: true
    name: ${DENTALCARE_NETWORK:-dentalcarepro_dentalcarepro}
