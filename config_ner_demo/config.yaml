# ==============================================================================
# Configurazione parametri per llm-gateway-demo
# Cartella: ./config_ner_demo
# Montata in Docker su /app/config_ner_demo (:ro)
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8090

keys:
  # Percorsi delle chiavi EC ES256 per la firma dei token JWT client
  dir: "./keys"
  private_key: "./keys/client-private.pem"
  public_key: "./keys/client-public.pem"

gateways:
  # Gateway Principale (Modello 0.3B DentalCare / Dual-Engine)
  llm_ner_gateway:
    url: "http://llm-ner-gateway:8080"
    ner_url: "http://llm-ner-gateway-ner:8000"
    label: "llm-ner-gateway (DentalCare 0.3B — :8080)"
    short_label: "llm-ner-gateway (0.3B)"

  # Gateway di Confronto (spaCy it_core_news_lg standard)
  llm_gateway:
    url: "http://llm-gateway:8085"
    ner_url: "http://llm-gateway-ner:8000"
    label: "llm-gateway (Standard spaCy — :8085)"
    short_label: "llm-gateway (spaCy)"

openai:
  url: "https://api.openai.com/v1/chat/completions"
